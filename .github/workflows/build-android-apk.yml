name: Build Android APK (心动小屋)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '填入部署后的小屋公网地址（例如 https://west2006.github.io/love-for-lover/）'
        required: false
        default: 'https://west2006.github.io/love-for-lover/'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build

      - name: Configure Capacitor server URL
        env:
          INPUT_URL: ${{ github.event.inputs.server_url }}
          VAR_URL: ${{ vars.LOVE_APP_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const url = (process.env.INPUT_URL || process.env.VAR_URL || "").trim().replace(/\/+$/, "");
            if (!url) {
              console.error("❌ 请先提供小屋公网地址！");
              process.exit(1);
            }
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.server = { url, cleartext: url.startsWith("http://") };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            console.log("✅ 已配置安卓软件连接地址:", url);
          '

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/cmdline-tools" ]; then
            SDKMGR=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1 || true)
            if [ -n "$SDKMGR" ]; then
              yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            fi
          fi
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: love-space-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
